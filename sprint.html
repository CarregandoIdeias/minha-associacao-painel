<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprint — Painel Central</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5EF; --bg-card: #ffffff; --text: #1A1712; --text-muted: #6B6558;
    --border: #E4E0D2; --accent: #C9A84C; --accent-hover: #E8CC80;
    --accent-soft: rgba(201, 168, 76, 0.1); --success: #2ECC71; --warning: #D9A441; --danger: #E74C3C;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  }
  [data-theme="dark"] {
    --bg: #0A0A0A; --bg-card: #1A1A1A; --text: #F9F8F5; --text-muted: #888888;
    --border: #1e1e1e; --accent: #C9A84C; --accent-hover: #E8CC80;
    --accent-soft: rgba(201, 168, 76, 0.1); --success: #2ECC71; --warning: #D9A441; --danger: #E74C3C;
    --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: background .2s, color .2s; }

  #tela-login { max-width: 420px; margin: 80px auto; background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 36px; box-shadow: var(--shadow); }
  #tela-login h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  #tela-login p.sub { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
  #erro-login { color: var(--danger); font-size: 13px; margin-top: 10px; display: none; }

  .campo { margin-bottom: 16px; }
  .campo label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-muted); }
  .campo input, .campo select, .campo textarea { width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); font-family: inherit; font-size: 14px; }
  .campo textarea { resize: vertical; min-height: 90px; }
  .campo input:focus, .campo select:focus, .campo textarea:focus { outline: none; border-color: var(--accent); }

  .btn { background: var(--accent); color: #0A0A0A; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; }
  .btn:hover { background: var(--accent-hover); }
  .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--accent-soft); color: var(--accent); }
  .btn-perigo { background: var(--danger); color: #fff; }
  .btn-perigo:hover { background: #c0392b; }
  .btn-pequeno { background: var(--accent-soft); color: var(--accent); border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-pequeno:hover { background: var(--accent); color: #0A0A0A; }

  a.link-voltar { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 13px; text-decoration: none; margin-bottom: 14px; }
  a.link-voltar:hover { color: var(--accent); }

  header.topo { display: flex; justify-content: space-between; align-items: center; padding: 18px 32px; background: var(--bg-card); border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
  .saudacao { font-size: 19px; font-weight: 700; }
  .logo { font-weight: 800; font-size: 14px; color: var(--accent); }
  .logo span { color: var(--text); }
  .theme-toggle { background: var(--accent-soft); border: none; border-radius: 10px; width: 38px; height: 38px; font-size: 16px; cursor: pointer; color: var(--accent); }

  main { max-width: 1200px; margin: 0 auto; padding: 32px; }
  #tela-dashboard { display: none; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .kpi-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); }
  .kpi-card .rotulo { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
  .kpi-card .valor { font-size: 24px; font-weight: 700; margin-top: 4px; color: var(--accent); }
  .kpi-card.alerta .valor { color: var(--warning); }
  .kpi-card.perigo .valor { color: var(--danger); }

  .painel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .painel-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
  .painel-header h3 { font-size: 15px; font-weight: 600; }
  .topo-acoes { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  .filtros { display: flex; gap: 10px; padding: 16px 22px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .filtros input, .filtros select {
    padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-family: inherit; font-size: 13px;
  }
  .filtros input { flex: 1; min-width: 160px; }

  #tabela-sprint-container { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 900px; }
  th, td { text-align: left; padding: 14px 16px; font-size: 14px; border-bottom: 1px solid var(--border); }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); }
  tr:last-child td { border-bottom: none; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge.pendente { background: var(--border); color: var(--text-muted); }
  .badge.em_andamento { background: rgba(217,164,65,0.15); color: var(--warning); }
  .badge.concluido { background: rgba(46,204,113,0.12); color: var(--success); }
  .badge.cancelado { background: rgba(231,76,60,0.12); color: var(--danger); }
  .badge.tipo-bug { background: rgba(231,76,60,0.12); color: var(--danger); }
  .badge.tipo-melhoria { background: var(--accent-soft); color: var(--accent); }
  .badge.prioridade-urgente { background: rgba(231,76,60,0.12); color: var(--danger); }
  .badge.prioridade-alta { background: rgba(217,164,65,0.15); color: var(--warning); }
  .badge.prioridade-media { background: var(--border); color: var(--text-muted); }
  .badge.prioridade-baixa { background: var(--border); color: var(--text-muted); }

  .descricao-truncada { max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

  .vazio { padding: 40px; text-align: center; color: var(--text-muted); font-size: 14px; }

  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal { background: var(--bg-card); border-radius: 16px; padding: 28px; width: 92%; max-width: 520px; box-shadow: var(--shadow); max-height: 90vh; overflow-y: auto; }
  .modal h3 { font-size: 18px; margin-bottom: 18px; }
  .modal-acoes { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }

  .toast { position: fixed; bottom: 24px; right: 24px; left: 24px; max-width: 380px; margin-left: auto; background: var(--accent); color: #0A0A0A; padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow); opacity: 0; transform: translateY(10px); transition: all .25s; z-index: 100; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.erro { background: var(--danger); color: #fff; }

  @media (max-width: 640px) {
    main { padding: 18px; }
    header.topo { padding: 14px 18px; }
    .kpis { grid-template-columns: 1fr 1fr; }
    th, td { padding: 10px 12px; font-size: 12px; }
    .descricao-truncada { max-width: 140px; }
  }
</style>
</head>
<body>

<div id="tela-login">
  <h2>Sprint <span style="color:var(--accent)">— Painel Central</span></h2>
  <p class="sub">Acesso restrito — login de Super Admin</p>
  <div class="campo"><label>E-mail</label><input type="email" id="login-email"></div>
  <div class="campo"><label>Senha</label><input type="password" id="login-senha"></div>
  <button class="btn" style="width:100%;" id="btn-login">Entrar</button>
  <p id="erro-login"></p>
</div>

<div id="tela-dashboard">
  <header class="topo">
    <div>
      <div class="logo">Sprint <span>— Melhorias & Bugs</span></div>
      <div class="saudacao" id="texto-saudacao" style="font-size:14px; font-weight:400; color:var(--text-muted);">Olá</div>
    </div>
    <div class="topo-acoes">
      <button class="theme-toggle" id="btn-tema" title="Alternar tema">☀</button>
      <button class="btn btn-ghost" id="btn-sair">Sair</button>
    </div>
  </header>

  <main>
    <a href="intranet.html" class="link-voltar">← Voltar para o Painel Central</a>

    <div class="kpis">
      <div class="kpi-card"><div class="rotulo">Pendentes</div><div class="valor" id="kpi-pendentes">0</div></div>
      <div class="kpi-card alerta"><div class="rotulo">Em andamento</div><div class="valor" id="kpi-andamento">0</div></div>
      <div class="kpi-card"><div class="rotulo">Concluídos</div><div class="valor" id="kpi-concluidos">0</div></div>
      <div class="kpi-card perigo"><div class="rotulo">Bugs urgentes/altos abertos</div><div class="valor" id="kpi-bugs-urgentes">0</div></div>
    </div>

    <div class="painel">
      <div class="painel-header">
        <h3>Itens de sprint</h3>
        <button class="btn" id="btn-novo-item">+ Novo item</button>
      </div>
      <div class="filtros">
        <input type="text" id="filtro-busca" placeholder="Buscar por título ou área...">
        <select id="filtro-tipo">
          <option value="">Todos os tipos</option>
          <option value="melhoria">Melhoria</option>
          <option value="bug">Bug</option>
        </select>
        <select id="filtro-status">
          <option value="">Todos os status</option>
          <option value="pendente">Pendente</option>
          <option value="em_andamento">Em andamento</option>
          <option value="concluido">Concluído</option>
          <option value="cancelado">Cancelado</option>
        </select>
        <select id="filtro-prioridade">
          <option value="">Todas as prioridades</option>
          <option value="urgente">Urgente</option>
          <option value="alta">Alta</option>
          <option value="media">Média</option>
          <option value="baixa">Baixa</option>
        </select>
      </div>
      <div id="tabela-sprint-container"><div class="vazio">Carregando...</div></div>
    </div>
  </main>
</div>

<!-- ===== MODAL NOVO/EDITAR ITEM ===== -->
<div class="overlay" id="overlay-modal-item">
  <div class="modal">
    <h3 id="titulo-modal-item">Novo item</h3>
    <input type="hidden" id="editar-item-id" value="">

    <div class="campo">
      <label>Tipo</label>
      <select id="item-tipo">
        <option value="melhoria">Melhoria</option>
        <option value="bug">Bug</option>
      </select>
    </div>
    <div class="campo"><label>Título</label><input type="text" id="item-titulo" maxlength="200"></div>
    <div class="campo"><label>Descrição (detalhe o que precisa mudar/o que está errado)</label><textarea id="item-descricao"></textarea></div>
    <div class="campo"><label>Área/tela (opcional)</label><input type="text" id="item-area" placeholder="ex: superadmin, portal, financeiro, backend" maxlength="60"></div>
    <div class="campo">
      <label>Prioridade</label>
      <select id="item-prioridade">
        <option value="baixa">Baixa</option>
        <option value="media" selected>Média</option>
        <option value="alta">Alta</option>
        <option value="urgente">Urgente</option>
      </select>
    </div>

    <div class="modal-acoes">
      <button class="btn btn-ghost" id="btn-cancelar-modal-item">Cancelar</button>
      <button class="btn" id="btn-salvar-item">Adicionar à sprint</button>
    </div>
  </div>
</div>

<!-- ===== MODAL DETALHES / STATUS ===== -->
<div class="overlay" id="overlay-modal-detalhe">
  <div class="modal">
    <h3 id="detalhe-titulo">—</h3>
    <div style="display:flex; gap:8px; margin-bottom:14px;">
      <span class="badge" id="detalhe-badge-tipo"></span>
      <span class="badge" id="detalhe-badge-prioridade"></span>
      <span class="badge" id="detalhe-badge-status"></span>
    </div>
    <p style="font-size:12px; color:var(--text-muted); margin-bottom:6px;" id="detalhe-area"></p>
    <p style="font-size:14px; white-space:pre-wrap; margin-bottom:18px;" id="detalhe-descricao"></p>

    <div class="campo">
      <label>Mover para status</label>
      <select id="detalhe-status-select">
        <option value="pendente">Pendente</option>
        <option value="em_andamento">Em andamento</option>
        <option value="concluido">Concluído</option>
        <option value="cancelado">Cancelado</option>
      </select>
    </div>
    <div class="campo">
      <label>Notas de aplicação (o que foi feito / onde)</label>
      <textarea id="detalhe-notas" placeholder="opcional"></textarea>
    </div>

    <div class="modal-acoes">
      <button class="btn-pequeno" id="btn-excluir-item" style="background:rgba(231,76,60,0.12); color:var(--danger);">Excluir</button>
      <span style="flex:1;"></span>
      <button class="btn btn-ghost" id="btn-editar-item">Editar</button>
      <button class="btn btn-ghost" id="btn-fechar-detalhe">Fechar</button>
      <button class="btn" id="btn-salvar-status">Salvar</button>
    </div>
  </div>
</div>

<!-- ===== MODAL CONFIRMAÇÃO ===== -->
<div class="overlay" id="overlay-modal-confirmacao">
  <div class="modal" style="max-width:420px;">
    <h3 id="titulo-modal-confirmacao">Confirmar ação</h3>
    <p id="texto-modal-confirmacao" style="font-size:14px; color:var(--text-muted); margin-bottom:20px;"></p>
    <div class="modal-acoes">
      <button class="btn btn-ghost" id="btn-cancelar-confirmacao">Cancelar</button>
      <button class="btn" id="btn-confirmar-confirmacao">Confirmar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="sprint.js"></script>

</body>
</html>
